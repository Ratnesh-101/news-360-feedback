[project]
name = "sih1329"
version = "0.1.0"
description = "360° News Feedback System for Government of India"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "langdetect>=1.0.9",
    "deep-translator>=1.11.4",
    "openai>=1.30.0",
    "openai-whisper>=20231117",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.1.0",
    "langchain-community>=0.2.0",
    "faiss-cpu>=1.8.0",
    "torch>=2.0.0",
]

[tool.uv.sources]
torch = { marker = "sys_platform == 'win32'" }